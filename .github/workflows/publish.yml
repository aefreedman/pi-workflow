name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or reconcile
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require a stable release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A stable v<version> release tag is required" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org

      - name: Set up trusted-publishing npm client
        run: npm install --global npm@11.6.2

      - name: Verify release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          expected_tag="v${package_version}"
          expected_git_head="$(git rev-parse HEAD)"

          if [[ "${package_version}" == *-* || "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Expected tag ${expected_tag}, got ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" != "${expected_git_head}" ]]; then
            echo "Release tag does not resolve to the checked-out commit" >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const notes = readFileSync('CHANGELOG.md', 'utf8');
          const heading = `## [${version}] - `;
          const lines = notes.split(/\r?\n/);
          const section = lines.findIndex(line => line.startsWith(heading));
          if (section < 0) throw new Error(`Missing finalized changelog for ${version}`);
          if (!/^\d{4}-\d{2}-\d{2}$/.test(lines[section].slice(heading.length))) throw new Error('Invalid release date');
          const end = lines.findIndex((line, index) => index > section && line.startsWith('## '));
          if (!lines.slice(section + 1, end < 0 ? undefined : end).some(line => line.startsWith('- '))) throw new Error('Empty release notes');
          NODE

          metadata_file="$(mktemp)"
          error_file="$(mktemp)"
          if npm view "${package_name}@${package_version}" version gitHead --json >"${metadata_file}" 2>"${error_file}"; then
            observed_version="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(d.version))" "${metadata_file}")"
            observed_git_head="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(d.gitHead))" "${metadata_file}")"
            rm -f "${metadata_file}" "${error_file}"
            if [[ "${observed_version}" != "${package_version}" || "${observed_git_head}" != "${expected_git_head}" ]]; then
              echo "Existing npm identity does not match ${expected_tag}" >&2
              exit 1
            fi
            echo "publish_required=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          rm -f "${metadata_file}"
          if ! grep -Eq '^npm error code E404\r?$' "${error_file}"; then
            cat "${error_file}" >&2
            rm -f "${error_file}"
            exit 1
          fi
          rm -f "${error_file}"
          echo "publish_required=true" >> "${GITHUB_OUTPUT}"

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Inspect prompt-only package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "${RUNNER_TEMP}/pack.json"
          node --input-type=module - "${RUNNER_TEMP}/pack.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const expected = ['package.json', 'README.md', 'LICENSE', 'CHANGELOG.md'];
          for (const directory of ['prompts/core', 'prompts/special']) {
            for (const name of readdirSync(directory)) {
              assert.ok(name.endsWith('.md'), `Unexpected prompt resource: ${name}`);
              expected.push(`${directory}/${name}`);
            }
          }
          assert.equal(pack.name, manifest.name);
          assert.equal(pack.version, manifest.version);
          assert.deepEqual(pack.files.map(file => file.path).sort(), expected.sort());
          assert.ok(pack.files.every(file => file.size > 0), 'Empty packed resource');
          console.log(JSON.stringify(pack, null, 2));
          NODE

      - name: Publish
        if: steps.identity.outputs.publish_required == 'true'
        run: npm publish
