name: Publish package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0

      - name: Set up trusted-publishing npm client
        run: npm install --global npm@11.6.2

      - name: Verify release identity
        shell: bash
        run: |
          expected_tag="v$(node --print "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Expected tag $expected_tag, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Publish
        run: npm publish

      - name: Verify published commit
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          published_head="$(npm view "$package_name@$package_version" gitHead)"
          if [[ "$published_head" != "$GITHUB_SHA" ]]; then
            echo "Published gitHead $published_head does not match $GITHUB_SHA" >&2
            exit 1
          fi
