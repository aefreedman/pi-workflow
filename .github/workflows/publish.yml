name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or reconcile
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org

      - name: Set up trusted-publishing npm client
        run: npm install --global npm@11.6.2

      - name: Verify release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          expected_tag="v${package_version}"
          expected_git_head="$(git rev-parse HEAD)"

          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Expected tag ${expected_tag}, got ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" != "${expected_git_head}" ]]; then
            echo "Release tag does not resolve to the checked-out commit" >&2
            exit 1
          fi

          metadata_file="$(mktemp)"
          error_file="$(mktemp)"
          if npm view "${package_name}@${package_version}" version gitHead --json >"${metadata_file}" 2>"${error_file}"; then
            observed_version="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(d.version))" "${metadata_file}")"
            observed_git_head="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(d.gitHead))" "${metadata_file}")"
            rm -f "${metadata_file}" "${error_file}"
            if [[ "${observed_version}" != "${package_version}" || "${observed_git_head}" != "${expected_git_head}" ]]; then
              echo "Existing npm identity does not match ${expected_tag}" >&2
              exit 1
            fi
            echo "publish_required=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          rm -f "${metadata_file}"
          if ! grep -q "E404" "${error_file}"; then
            cat "${error_file}" >&2
            rm -f "${error_file}"
            exit 1
          fi
          rm -f "${error_file}"
          echo "publish_required=true" >> "${GITHUB_OUTPUT}"

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Publish
        if: steps.identity.outputs.publish_required == 'true'
        run: npm publish

      - name: Verify published commit
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          expected_git_head="$(git rev-parse HEAD)"
          for attempt in {1..10}; do
            published_head="$(npm view "${package_name}@${package_version}" gitHead 2>/dev/null || true)"
            if [[ "${published_head}" == "${expected_git_head}" ]]; then
              exit 0
            fi
            sleep 3
          done
          echo "Published gitHead did not converge to ${expected_git_head}" >&2
          exit 1
